<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhúng CSS - Internal Style</title>
    <!-- Nhúng CSS bên trong thẻ <style> -->
    <style>
        h1 {
            color: purple;
        }
        p {
            color: darkorange;
        }
    </style>
</head>
<body>

    <h1>Tiêu đề bài viết (Internal CSS)</h1>
    <p>Đoạn văn bản được thay đổi màu sắc bằng cách nhúng Internal CSS.</p>

</body>
</html>
